version: 2

# The single ecosystem below carries a 7-day `cooldown`: Dependabot will not open
# an update PR until a release has been public for a week. Pulling a version the
# day it ships is exactly when a compromised release does its damage — the
# xz-utils backdoor was caught in that window. A week gives the community time to
# spot and report obvious tampering before it reaches this repo. Without this
# block Dependabot only applies its built-in 3-day cooldown, which the audit
# treats as too short.
updates:
  # GitHub Actions — keeps the SHA-pinned action references current, bumping
  # both the pinned commit and the version comment as new releases land.
  # It is the only ecosystem with committed manifests here: composer.lock is
  # gitignored and there is no JS lockfile, so there is nothing for Dependabot
  # to maintain on the Composer or npm side.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
